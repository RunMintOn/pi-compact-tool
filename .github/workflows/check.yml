name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Host packages are peers, so this resolves the current Pi release and
      # typechecks and tests the extension against it.
      - run: npm install --ignore-scripts
      - run: npm run check
